name: Site bundle — check and deploy

# Production (www.zynix.ai, Webflow) loads two files from this repo through jsDelivr @main:
#   zynix-site-scripts-unminified.js   and   zynix-site-styles.deployed.css
#   or, once the Webflow head and footer point at them, their deploy build (ci/build.mjs):
#   dist/zynix-site-scripts.deployed.js   and   dist/zynix-site-styles.deployed.css
# A merge to main is therefore a production deploy. This workflow is the gate and the deploy step:
#   pull request -> static checks + headless smoke test against the live site with the PR's files swapped in
#   push to main -> the same checks, then purge jsDelivr's @main cache and prove the CDN serves the new bytes

on:
  # No paths filter here on purpose: 'checks' is a required status check on main,
  # so it must report on EVERY pull request or a PR that touches only images or
  # HTML would wait forever for a check that never runs.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'zynix-site-scripts-unminified.js'
      - 'zynix-site-styles.deployed.css'
      - 'dist/**'
      - 'ci/**'
      - '.github/workflows/site-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax
        run: node --check zynix-site-scripts-unminified.js
      - name: Static checks
        run: node ci/static-checks.mjs
      - name: Deploy build is current (dist/ = node ci/build.mjs of this commit's sources; production loads dist/)
        run: node ci/build.mjs --check
      - name: Smoke test (live pages, this commit's files swapped in; read-only)
        run: |
          set +e
          node ci/smoke.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::Smoke test inconclusive: production could not be loaded from this runner. Static checks passed."
          elif [ "$code" != "0" ]; then
            exit 1
          fi

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CDN: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main
      PURGE: https://purge.jsdelivr.net/gh/${{ github.repository }}@main
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Purge jsDelivr @main
        run: |
          for f in zynix-site-scripts-unminified.js zynix-site-styles.deployed.css dist/zynix-site-scripts.deployed.js dist/zynix-site-styles.deployed.css; do
            echo "purging $f"; curl -fsS --retry 3 "$PURGE/$f" | head -c 400; echo
          done
      - name: Prove the CDN serves this commit (br, gzip and identity, each decoded)
        run: |
          # jsDelivr caches each Content-Encoding separately: on 2026-10-09 a purge refreshed gzip/identity while browsers
          # (Accept-Encoding: br) kept getting the old brotli copy. ci/cdn-verify.mjs checks all three; on a stale copy, purge
          # again and back off (15, 30, 60, 120, 240 s), then fail.
          ok=0
          for i in 1 2 3 4 5 6; do
            if out=$(node ci/cdn-verify.mjs "$CDN" zynix-site-scripts-unminified.js zynix-site-styles.deployed.css dist/zynix-site-scripts.deployed.js dist/zynix-site-styles.deployed.css); then ok=1; echo "$out"; break; fi
            echo "$out"
            if [ "$i" = 6 ]; then break; fi
            wait=$((15 << (i - 1)))
            echo "attempt $i: not current in every encoding; purging again, next check in ${wait}s"
            for f in zynix-site-scripts-unminified.js zynix-site-styles.deployed.css dist/zynix-site-scripts.deployed.js dist/zynix-site-styles.deployed.css; do curl -fsS --retry 3 "$PURGE/$f" >/dev/null || echo "purge of $f failed"; done
            sleep "$wait"
          done
          if [ "$ok" != "1" ]; then
            echo "$out" | grep -E '^(STALE|FAIL)' | sed 's/^/::error::/' || true
            echo "::error::jsDelivr @main still serves old bytes after 5 re-purges (~8 minutes). Browsers send Accept-Encoding: br, so a stale br copy means visitors get the old build."
            exit 1
          fi
          {
            echo "### Deployed ${GITHUB_SHA::7} to jsDelivr @main (br, gzip and identity verified)"
            echo ""
            echo "| file | sha256 |"
            echo "|---|---|"
            for f in zynix-site-scripts-unminified.js zynix-site-styles.deployed.css dist/zynix-site-scripts.deployed.js dist/zynix-site-styles.deployed.css; do echo "| \`$f\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
            echo ""
            echo "Returning visitors pick it up on their next page view (the bundle re-validates its own cache in the background)."
          } >> "$GITHUB_STEP_SUMMARY"
